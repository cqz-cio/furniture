name: ERP full-stack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  ERP_ADMIN_IMAGE: cqz-cio/furniture-erp-admin
  ERP_BACKEND_IMAGE: cqz-cio/furniture-erp-backend
  ERP_RELEASE_ID: cd-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
  ERP_TEST_API_BASE_URL: ${{ vars.ERP_TEST_API_BASE_URL }}
  ERP_TEST_STOREFRONT_URL: ${{ vars.ERP_TEST_STOREFRONT_URL }}

concurrency:
  group: erp-full-stack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-deployment-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify release, isolation, rollback and retention behavior
        run: timeout --kill-after=5s 90s python3 -B -m unittest discover -s deploy/erp/tests -v
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Compile migration-only helper and verify both tenant audit phases
        run: timeout --kill-after=5s 60s python3 -B deploy/erp/verify-bootstrap.py
      - name: Check the two shell entry points
        run: |
          for script in deploy/erp/deploy-test.sh deploy/erp/deploy-production.sh; do
            bash -n "$script"
          done

  verify-database-and-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Protect immutable migration history
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            exit 0
          fi
          violations="$(git diff --name-status "$BASE_SHA" "$GITHUB_SHA" -- \
            "yudao电商管理平台前后端/yudao-cloud/sql/mysql/migrations" \
            "yudao电商管理平台前后端/yudao-cloud/sql/mysql/flyway" \
            | awk '$1 != "A"')"
          if [[ -n "$violations" ]]; then
            echo "Committed V/B migrations are immutable; only new files may be added:"
            echo "$violations"
            exit 1
          fi

      - name: Set up Node.js for database verification
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: furniture web/package-lock.json

      # These migration tools currently live in furniture web. This step does
      # not build or publish that unrelated RH storefront.
      - name: Install database verification dependencies
        working-directory: furniture web
        run: npm ci

      - name: Regenerate and verify migration artifacts
        working-directory: furniture web
        run: |
          npm run build:db-baseline
          npm run verify:db-migrations
          npm test -- tests/dbMigrations.test.js tests/databaseSafetyWorkflow.test.js

      - name: Require committed generated baselines
        run: git diff --exit-code -- "yudao电商管理平台前后端/yudao-cloud/sql/mysql/oakved-baseline.sql" "yudao电商管理平台前后端/yudao-cloud/sql/mysql/flyway"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Test Flyway on disposable MySQL and build backend JAR
        working-directory: yudao电商管理平台前后端/yudao-cloud
        env:
          OAKVED_FLYWAY_TEST_ADMIN_URL: jdbc:mysql://127.0.0.1:3306/?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          OAKVED_FLYWAY_TEST_USER: root
          OAKVED_FLYWAY_TEST_PASSWORD: root
        run: mvn -B -ntp -pl yudao-server -am -Dtest=OakvedFlywayIntegrationTest -Dsurefire.failIfNoSpecifiedTests=false package

      - name: Verify migrations are packaged in the JAR
        working-directory: yudao电商管理平台前后端/yudao-cloud
        shell: bash
        run: |
          jar tf yudao-server/target/yudao-server.jar > yudao-server/target/jar-contents.txt
          baseline_count=$(grep -c 'BOOT-INF/classes/db/migration/B[0-9][0-9][0-9]__oakved_baseline.sql' yudao-server/target/jar-contents.txt)
          versioned_count=$(grep -c 'BOOT-INF/classes/db/migration/V[0-9][0-9][0-9]__.*.sql' yudao-server/target/jar-contents.txt)
          expected_count=$(find sql/mysql/migrations -maxdepth 1 -type f -name 'V*.sql' | wc -l)
          latest_baseline=$(find sql/mysql/flyway -maxdepth 1 -type f -name 'B*.sql' -printf '%f\n' | sort | tail -n1)
          test "$baseline_count" -ge 1
          grep -q "BOOT-INF/classes/db/migration/${latest_baseline}" yudao-server/target/jar-contents.txt
          test "$versioned_count" -eq "$expected_count"

      - name: Verify layered backend dependencies and CD migration extraction
        run: >-
          timeout --kill-after=5s 120s python3 -B deploy/erp/verify-image-layers.py
          --jar "yudao电商管理平台前后端/yudao-cloud/yudao-server/target/yudao-server.jar"
          --migrations "yudao电商管理平台前后端/yudao-cloud/sql/mysql/migrations"

  verify-erp-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: yudao电商管理平台前后端/yudao-ui-admin-vue3

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: yudao电商管理平台前后端/yudao-ui-admin-vue3/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The inherited Yudao UI still has known type debt outside the furniture
      # modules. Keep reporting it without making every production build red.
      - name: Report ERP admin type debt
        continue-on-error: true
        run: pnpm ts:check

      - name: Build ERP admin
        env:
          VITE_BASE_URL: https://api.vanzhome.com
          VITE_API_URL: /admin-api
          VITE_BASE_PATH: /admin/
          VITE_FURNITURE_WEB_URL: https://www.vanzhome.com
          VITE_MALL_H5_DOMAIN: https://www.vanzhome.com
        run: pnpm build:prod

      - name: Verify ERP admin output
        shell: bash
        run: |
          test -s dist-prod/index.html
          grep -Rsl 'https://api.vanzhome.com' dist-prod/assets | grep -q .

  verify-docker-images:
    name: Build and publish ERP Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - verify-database-and-backend
      - verify-erp-admin
      - verify-deployment-scripts
    permissions:
      contents: write
      packages: write
    concurrency:
      group: erp-release-control
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate optional test image configuration
        shell: bash
        run: |
          if [[ -z "$ERP_TEST_API_BASE_URL" && -z "$ERP_TEST_STOREFRONT_URL" ]]; then
            echo '::notice::Production image publishing continues. Configure both ERP_TEST_API_BASE_URL and ERP_TEST_STOREFRONT_URL to register deployable test/production releases.'
          else
            PYTHONPATH=deploy/erp python3 - <<'PY'
          import os
          from common import public_url, api_origin, require
          public_url(os.environ['ERP_TEST_API_BASE_URL'])
          public_url(os.environ['ERP_TEST_STOREFRONT_URL'])
          require(api_origin(os.environ['ERP_TEST_API_BASE_URL']) != api_origin('https://api.vanzhome.com'), 'Test API cannot be production')
          PY
          fi

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate ERP admin image metadata
        id: admin-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.ERP_ADMIN_IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ env.ERP_RELEASE_ID }}-production,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Generate ERP backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.ERP_BACKEND_IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ env.ERP_RELEASE_ID }},enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and publish ERP admin image
        id: admin-image
        uses: docker/build-push-action@v7
        with:
          context: ./yudao电商管理平台前后端/yudao-ui-admin-vue3
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.admin-meta.outputs.tags }}
          labels: ${{ steps.admin-meta.outputs.labels }}
          build-args: |
            ERP_RELEASE_ID=${{ env.ERP_RELEASE_ID }}
            ERP_DEPLOY_ENVIRONMENT=production
            VITE_BASE_URL=https://api.vanzhome.com
            VITE_API_URL=/admin-api
            VITE_BASE_PATH=/admin/
            VITE_FURNITURE_WEB_URL=https://www.vanzhome.com
            VITE_MALL_H5_DOMAIN=https://www.vanzhome.com
          cache-from: type=gha,scope=erp-admin
          cache-to: type=gha,mode=max,scope=erp-admin

      - name: Build and publish ERP backend image
        id: backend-image
        uses: docker/build-push-action@v7
        with:
          context: ./yudao电商管理平台前后端/yudao-cloud
          platforms: linux/amd64
          file: ./yudao电商管理平台前后端/yudao-cloud/yudao-server/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha,scope=erp-backend
          cache-to: type=gha,mode=max,scope=erp-backend

      - name: Build and publish test admin image from the same commit
        if: github.ref == 'refs/heads/main' && env.ERP_TEST_API_BASE_URL != '' && env.ERP_TEST_STOREFRONT_URL != ''
        id: test-admin-image
        uses: docker/build-push-action@v7
        with:
          context: ./yudao电商管理平台前后端/yudao-ui-admin-vue3
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.ERP_ADMIN_IMAGE }}:${{ env.ERP_RELEASE_ID }}-test
          labels: ${{ steps.admin-meta.outputs.labels }}
          build-args: |
            ERP_RELEASE_ID=${{ env.ERP_RELEASE_ID }}
            ERP_DEPLOY_ENVIRONMENT=test
            VITE_BASE_URL=${{ env.ERP_TEST_API_BASE_URL }}
            VITE_API_URL=/admin-api
            VITE_BASE_PATH=/admin/
            VITE_FURNITURE_WEB_URL=${{ env.ERP_TEST_STOREFRONT_URL }}
            VITE_MALL_H5_DOMAIN=${{ env.ERP_TEST_STOREFRONT_URL }}
          cache-from: type=gha,scope=erp-admin-test
          cache-to: type=gha,mode=max,scope=erp-admin-test

      - name: Verify test admin does not embed the production API
        if: steps.test-admin-image.outcome == 'success'
        env:
          TEST_ADMIN_DIGEST: ${{ steps.test-admin-image.outputs.digest }}
        shell: bash
        run: |
          container_id=$(docker create "${REGISTRY}/${ERP_ADMIN_IMAGE}@${TEST_ADMIN_DIGEST}")
          trap 'docker rm "$container_id" >/dev/null' EXIT
          mkdir -p "$RUNNER_TEMP/erp-admin-test"
          docker cp "$container_id:/usr/share/nginx/html/admin/." "$RUNNER_TEMP/erp-admin-test/"
          python3 - <<'PY'
          import os
          from pathlib import Path
          assets = list((Path(os.environ['RUNNER_TEMP']) / 'erp-admin-test/assets').glob('*.js'))
          assert assets, 'No test admin assets'
          assert all(b'https://api.vanzhome.com' not in p.read_bytes() for p in assets), 'Production API found in test bundle'
          assert any(os.environ['ERP_TEST_API_BASE_URL'].encode() in p.read_bytes() for p in assets), 'Test API absent from bundle'
          PY

      - name: Verify local image metadata
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          test "$(docker image inspect "${REGISTRY}/${ERP_ADMIN_IMAGE}:${GITHUB_SHA}" --format '{{.Config.ExposedPorts}}')" = "map[80/tcp:{}]"
          test "$(docker image inspect "${REGISTRY}/${ERP_BACKEND_IMAGE}:${GITHUB_SHA}" --format '{{.Config.ExposedPorts}}')" = "map[48080/tcp:{}]"

      - name: Verify published images
        if: github.event_name != 'pull_request'
        run: |
          docker buildx imagetools inspect "${REGISTRY}/${ERP_ADMIN_IMAGE}:${GITHUB_SHA}"
          docker buildx imagetools inspect "${REGISTRY}/${ERP_BACKEND_IMAGE}:${GITHUB_SHA}"

      - name: Summarize published images
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          {
            echo "## ERP Docker images"
            echo
            echo "- \`${REGISTRY}/${ERP_ADMIN_IMAGE}:${GITHUB_SHA}\`"
            echo "- \`${REGISTRY}/${ERP_BACKEND_IMAGE}:${GITHUB_SHA}\`"
            if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
              echo "- Updated aliases: \`main\`, \`latest\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Register complete deployable release
        if: github.ref == 'refs/heads/main' && steps.test-admin-image.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_DIGEST: ${{ steps.backend-image.outputs.digest }}
          TEST_ADMIN_DIGEST: ${{ steps.test-admin-image.outputs.digest }}
          PRODUCTION_ADMIN_DIGEST: ${{ steps.admin-image.outputs.digest }}
        run: timeout --kill-after=5s 120s python3 -B deploy/erp/github_release.py --publish --output "$RUNNER_TEMP/release.json"
