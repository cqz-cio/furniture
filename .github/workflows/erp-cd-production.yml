name: ERP CD - production

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Exact local CI release ID already deployed successfully by ERP CD - test
        required: true
        type: string
      operation:
        description: Preflight publishes built images and checks server without switching; deploy or rollback changes production
        required: true
        default: preflight
        type: choice
        options: [preflight, deploy, rollback]

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  group: erp-release-control
  cancel-in-progress: false

jobs:
  prepare-images:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: [self-hosted, Windows, X64, erp-test-local]
    timeout-minutes: 20
    concurrency:
      group: erp-test-local-build-deploy
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      packages: write
      deployments: read
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Publish the tested CI artifacts without rebuilding
        env:
          PYTHONUTF8: '1'
          GH_TOKEN: ${{ github.token }}
          ERP_CD_ENABLED: ${{ vars.ERP_CD_ENABLED }}
          ERP_RELEASE_ID: ${{ inputs.release_id }}
          ERP_OPERATION: ${{ inputs.operation }}
        run: |
          & 'C:\Python314\python.exe' -u -B deploy/erp/promote_local.py --release $env:ERP_RELEASE_ID --operation $env:ERP_OPERATION --cache 'D:\furniture web2b\work\erp-ci-cache'
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erp-production-promotion-result
          path: production-promotion-result.json
          if-no-files-found: ignore
          retention-days: 30

  deploy:
    needs: prepare-images
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Require test success and deploy the exact production release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ERP_CD_ENABLED: ${{ vars.ERP_CD_ENABLED }}
          ERP_IMAGE_TRANSPORT: ghcr
          ERP_SSH_HOST: ${{ vars.ERP_SSH_HOST }}
          ERP_SSH_USER: ${{ vars.ERP_SSH_USER }}
          ERP_SSH_PORT: ${{ vars.ERP_SSH_PORT }}
          ERP_DEPLOY_ROOT: ${{ vars.ERP_DEPLOY_ROOT }}
          ERP_SSH_PRIVATE_KEY: ${{ secrets.ERP_SSH_PRIVATE_KEY }}
          ERP_SSH_KNOWN_HOSTS: ${{ secrets.ERP_SSH_KNOWN_HOSTS }}
          RELEASE_ID: ${{ inputs.release_id }}
          OPERATION: ${{ inputs.operation }}
        run: timeout --kill-after=10s 1550s bash deploy/erp/deploy-production.sh --release "$RELEASE_ID" --operation "$OPERATION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erp-production-deployment-result
          path: deploy/erp/erp-cd-result.json
          if-no-files-found: ignore
          retention-days: 30
