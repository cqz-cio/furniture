name: ERP CD - production

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Exact local CI release ID already deployed successfully by ERP CD - test
        required: true
        type: string
      operation:
        description: First adoption uses preflight, prepare, cutover; daily releases use deploy; recover resumes an interrupted first cutover
        required: true
        default: preflight
        type: choice
        options: [preflight, prepare, cutover, recover, deploy, rollback]
      confirm_cutover:
        description: Confirm production maintenance and database-copy cutover or recovery (required only for cutover/recover)
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  group: erp-release-control
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Require test success and run the selected production operation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ERP_CD_ENABLED: ${{ vars.ERP_CD_ENABLED }}
          ERP_IMAGE_TRANSPORT: ghcr
          ERP_SSH_HOST: ${{ vars.ERP_SSH_HOST }}
          ERP_SSH_USER: ${{ vars.ERP_SSH_USER }}
          ERP_SSH_PORT: ${{ vars.ERP_SSH_PORT }}
          ERP_DEPLOY_ROOT: ${{ vars.ERP_DEPLOY_ROOT }}
          ERP_SSH_PRIVATE_KEY: ${{ secrets.ERP_SSH_PRIVATE_KEY }}
          ERP_SSH_KNOWN_HOSTS: ${{ secrets.ERP_SSH_KNOWN_HOSTS }}
          RELEASE_ID: ${{ inputs.release_id }}
          OPERATION: ${{ inputs.operation }}
          CONFIRM_CUTOVER: ${{ inputs.confirm_cutover }}
        run: timeout --kill-after=10s 1750s bash deploy/erp/deploy-production.sh --release "$RELEASE_ID" --operation "$OPERATION" --confirm-cutover "$CONFIRM_CUTOVER"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erp-production-deployment-result
          path: deploy/erp/erp-cd-result.json
          if-no-files-found: ignore
          retention-days: 30
