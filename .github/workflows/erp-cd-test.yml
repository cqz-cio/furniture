name: ERP CD - test

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Complete CI release ID (cd-commit-run-attempt)
        required: true
        type: string
      operation:
        description: prepare first, cutover once, then deploy/rollback; recover an interrupted cutover
        required: true
        default: prepare
        type: choice
        options: [prepare, cutover, recover, deploy, rollback]
      confirm_cutover:
        description: Allow the first test maintenance cutover or recovery (brief ERP interruption)
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  group: erp-release-control
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: inputs.operation == 'prepare' || inputs.operation == 'cutover' || inputs.operation == 'recover'
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        if: inputs.operation == 'prepare' || inputs.operation == 'cutover' || inputs.operation == 'recover'
        with:
          distribution: temurin
          java-version: 17
      - name: Run the unified test CD entry point
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ERP_IMAGE_TRANSPORT: ssh
          ERP_CD_ENABLED: ${{ vars.ERP_CD_ENABLED }}
          ERP_SSH_HOST: ${{ vars.ERP_SSH_HOST || vars.TENCENT_SSH_HOST }}
          ERP_SSH_USER: ${{ vars.ERP_SSH_USER || vars.TENCENT_SSH_USER }}
          ERP_SSH_PORT: ${{ vars.ERP_SSH_PORT || vars.TENCENT_SSH_PORT }}
          ERP_DEPLOY_ROOT: ${{ vars.ERP_DEPLOY_ROOT }}
          ERP_SSH_PRIVATE_KEY: ${{ secrets.ERP_SSH_PRIVATE_KEY || secrets.TENCENT_SSH_PRIVATE_KEY }}
          ERP_SSH_KNOWN_HOSTS: ${{ secrets.ERP_SSH_KNOWN_HOSTS || secrets.TENCENT_SSH_KNOWN_HOSTS }}
          RELEASE_ID: ${{ inputs.release_id }}
          OPERATION: ${{ inputs.operation }}
          CONFIRM_CUTOVER: ${{ inputs.confirm_cutover }}
        run: timeout --kill-after=15s 3200s bash deploy/erp/deploy-test.sh --release "$RELEASE_ID" --operation "$OPERATION" --confirm-cutover "$CONFIRM_CUTOVER"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erp-test-deployment-result
          path: deploy/erp/erp-cd-result.json
          if-no-files-found: ignore
          retention-days: 30
