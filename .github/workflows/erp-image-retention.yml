name: ERP image retention

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Delete older complete releases, keeping the latest five locally and in GHCR
        type: boolean
        default: false
  workflow_run:
    workflows: [ERP local image CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '30 19 * * *' # 03:30 Asia/Shanghai

permissions:
  contents: read

# Same lock order as CI: local archives first, then registry/releases.
concurrency:
  group: erp-test-local-build-deploy
  cancel-in-progress: false

jobs:
  clean:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.ERP_IMAGE_CLEANUP_ENABLED != 'false') &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_repository.full_name == github.repository &&
         github.event.workflow_run.head_branch == 'main'))
    runs-on: [self-hosted, Windows, X64, erp-test-local]
    timeout-minutes: 15
    concurrency:
      group: erp-release-control
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      actions: read
    defaults:
      run:
        shell: powershell
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      PYTHONUTF8: '1'
      ERP_LOCAL_CACHE: D:\furniture web2b\work\erp-ci-cache
      ERP_IMAGE_CLEANUP_ENABLED: ${{ vars.ERP_IMAGE_CLEANUP_ENABLED != 'false' }}
      ERP_CLEANUP_APPLY: ${{ github.event_name != 'workflow_dispatch' || inputs.apply }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Inspect and clean complete local image archives
        run: |
          $options = @()
          if ($env:ERP_CLEANUP_APPLY -eq 'true') { $options += '--apply' }
          & 'C:\Python314\python.exe' -u -B deploy/erp/cache_retention.py --cache $env:ERP_LOCAL_CACHE @options
          exit $LASTEXITCODE
      - name: Inspect and clean published GHCR releases
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $options = @()
          if ($env:ERP_CLEANUP_APPLY -eq 'true') { $options += '--apply' }
          & 'C:\Python314\python.exe' -u -B deploy/erp/retention.py @options
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erp-retention-plan
          path: |
            local-retention-plan.json
            retention-plan.json
          if-no-files-found: ignore
          retention-days: 30
