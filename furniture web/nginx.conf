server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml
    text/css
    text/plain;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id' 'strict-dynamic'; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; frame-src 'self' https:; connect-src 'self' http: https:; form-action 'self' http: https:; base-uri 'self'; object-src 'none'; frame-ancestors 'self';" always;

  # A fresh nonce authorizes the application and the CMS scripts it explicitly loads.
  # Keep script-src free of unsafe-inline; the shell must never be cached.
  sub_filter '<script ' '<script nonce="$request_id" ';
  sub_filter '<head>' '<head><meta property="csp-nonce" nonce="$request_id">';
  sub_filter_once off;

  location = /index.html {
    # Nginx add_header is not inherited when this location adds Cache-Control.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id' 'strict-dynamic'; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; frame-src 'self' https:; connect-src 'self' http: https:; form-action 'self' http: https:; base-uri 'self'; object-src 'none'; frame-ancestors 'self';" always;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location /assets/ {
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
