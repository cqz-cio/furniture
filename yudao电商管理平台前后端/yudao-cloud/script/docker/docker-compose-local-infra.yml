name: yudao-local-infra

services:
  mysql:
    image: mysql:8.0
    container_name: yudao-mysql-local
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "ruoyi-vue-pro"
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - yudao_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h127.0.0.1 -P3306 -uroot -p$${MYSQL_ROOT_PASSWORD} $${MYSQL_DATABASE} -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: yudao-redis-local
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - yudao_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: yudao-libretranslate-local
    user: root
    command: ["--load-only", "en,zh"]
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - yudao_libretranslate_models:/home/libretranslate/.local/share/argos-translate
    restart: unless-stopped

volumes:
  yudao_mysql_data:
  yudao_redis_data:
  yudao_libretranslate_models:
